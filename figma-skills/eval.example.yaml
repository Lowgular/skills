# Starter eval — four rows against the Simple Design System (Community).
#
#   cp eval.example.yaml eval.yaml
#   skillgrade
#
# Copy rather than edit in place: eval.yaml is gitignored, because the full
# suites are generated from LangSmith and a generated file in git drifts from
# its source.
#
# One row per capability, so a failure points somewhere specific:
#
#   locate      drive the browser to a node       → graders/browser-state.mjs
#   component   read a component's variant axis   → graders/score-answer.mjs
#   property    read a fill as value + token name → graders/score-answer.mjs
#   vars        resolve a token to a hex per mode → graders/score-answer.mjs
#
# Each row also carries a trajectory grader — did it go through the skill, and
# via which command. On three of these it is weighted 1, so it gates: those
# rows check the route as well as the answer. On the locate row it is weighted
# 0 and only reports. Set them all to 0 to measure the answer alone and let the
# agent get there however it likes.
#
# PREREQUISITES
#   - Chrome running with remote debugging on 9333, logged in to Figma
#   - FIGMA_FILE set to the Simple Design System file key (see .env.example)
#   - the file open in the DESIGN EDITOR. A view-only or Community preview tab
#     has no Plugin API, and every row fails on the same error.

version: "1"

# Without this, skillgrade injects no skill and measures a bare agent.
skill: figma-browser

defaults:
  agent: claude
  provider: local
  trials: 1
  timeout: 300
  threshold: 0.6

tasks:
  - name: locate-f6c6586a
    instruction: |
      A dedicated Chrome is already running and logged in to Figma, with remote
      debugging on http://localhost:9333. The Figma design file is open at its
      first page with nothing selected.
      
      open Pricing card
    graders:
      - type: deterministic
        run: 'EXPECTED_NODE_ID=1444-11846 node graders/browser-state.mjs'
        weight: 1
      - type: deterministic
        run: 'node graders/trajectory.mjs --grade --expected=''{"mode":"sequence","steps":["skill","figma:open"]}'''
        weight: 0
  - name: component-4da43204
    instruction: |
      A dedicated Chrome is already running and logged in to Figma, with remote
      debugging on http://localhost:9333. The Figma design file is open at its
      first page with nothing selected.
      
      what variants of Pricing Card do we have?
    graders:
      - type: deterministic
        run: 'node graders/score-answer.mjs --spec=''{"mode":"exact","field":"Variant","optional":["Pricing Card"],"required":["Stroke","Brand"],"forbidden":["Desktop","Mobile"]}'''
        weight: 1
      - type: deterministic
        run: 'node graders/trajectory.mjs --grade --expected=''{"mode":"sequence","steps":["skill","figma"]}'''
        weight: 1
  - name: property-0998e97f
    instruction: |
      A dedicated Chrome is already running and logged in to Figma, with remote
      debugging on http://localhost:9333. The Figma design file is open at its
      first page with nothing selected.
      
      Find the Pricing Card Desktop Brand component and give me the value for fill property
    graders:
      - type: deterministic
        run: 'node graders/score-answer.mjs --spec=''{"mode":"contains","field":"fill token","optional":["#2c2c2c","--sds-color-background-brand-default"],"required":["Background/Brand/Default"],"forbidden":["Border/Brand/Default","Background/Default/Default"]}'''
        weight: 1
      - type: deterministic
        run: 'node graders/trajectory.mjs --grade --expected=''{"mode":"sequence","steps":["skill","figma"]}'''
        weight: 1
  - name: vars-40b9b21f
    instruction: |
      A dedicated Chrome is already running and logged in to Figma, with remote
      debugging on http://localhost:9333. The Figma design file is open at its
      first page with nothing selected.
      
      what is the hex value for Background/Brand/Default
    graders:
      - type: deterministic
        run: 'node graders/score-answer.mjs --spec=''{"mode":"contains","field":"hex","optional":["SDS Light","SDS Dark","Brand/800","Brand/100"],"required":["#2c2c2c","#f5f5f5"],"forbidden":["#1e1e1e"]}'''
        weight: 1
      - type: deterministic
        run: 'node graders/trajectory.mjs --grade --expected=''{"mode":"sequence","steps":["skill","figma:vars"]}'''
        weight: 1
